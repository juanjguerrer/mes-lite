server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The MES answers under /api, same origin as the page, so the browser needs no CORS.
    location /api/ {
        proxy_pass http://mes:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Files in the build have a hash in their name, so they can be cached for good.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a route of the app (for example /lines/3 after a reload).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
