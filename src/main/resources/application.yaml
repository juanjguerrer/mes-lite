spring:
  application:
    name: mes-lite
  config:
    import: "optional:file:./.env[.properties]"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/mes_lite}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD}"
